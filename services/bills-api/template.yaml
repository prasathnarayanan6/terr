AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Terraclime bill-delivery microservice deployed as a dedicated Lambda.

Parameters:
  StageName:
    Type: String
    Default: prod
  UseDemoData:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
  ZeptoApiKey:
    Type: String
    Default: ""
    NoEcho: true
  AwsRegion:
    Type: String
    Default: ap-south-1
  UsersTable:
    Type: String
    Default: UserCredentials
  FlowTable:
    Type: String
    Default: flow_data
  ApartmentTable:
    Type: String
    Default: apartment_data
  BillingTable:
    Type: String
    Default: billing_cycles
  LeaksTable:
    Type: String
    Default: leak_events

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        NODE_ENV: production
        USE_DEMO_DATA: !Ref UseDemoData
        ZEPTO_API_KEY: !Ref ZeptoApiKey
        AWS_REGION: !Ref AwsRegion
        USERS_TABLE: !Ref UsersTable
        FLOW_TABLE: !Ref FlowTable
        APARTMENT_TABLE: !Ref ApartmentTable
        BILLING_TABLE: !Ref BillingTable
        LEAKS_TABLE: !Ref LeaksTable

Resources:
  BillsApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName

  BillsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../microservice-runtime/
      Handler: bills-api/src/index.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:BatchGetItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTable}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FlowTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FlowTable}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApartmentTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ApartmentTable}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BillingTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BillingTable}/index/*
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LeaksTable}
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LeaksTable}/index/*
      Events:
        RootRoute:
          Type: Api
          Properties:
            RestApiId: !Ref BillsApiGateway
            Path: /
            Method: ANY
        ProxyRoute:
          Type: Api
          Properties:
            RestApiId: !Ref BillsApiGateway
            Path: /{proxy+}
            Method: ANY

Outputs:
  BillsBaseUrl:
    Description: Base URL for the deployed bill-delivery API stage.
    Value: !Sub https://${BillsApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  BillsSendBulkEndpoint:
    Description: POST endpoint for bulk bill delivery.
    Value: !Sub https://${BillsApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/api/bills/send-bulk


